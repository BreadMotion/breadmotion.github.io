<!doctype html>
<html lang="ja">
    <head>
        <!-- ========================================
             README: GitHub Pages Redirect
             
             This page uses a meta refresh + JavaScript redirect because
             GitHub Pages does not support HTTP 301 redirects.
             
             If you host on a platform that supports server-side redirects
             (Netlify, Vercel, Apache, Nginx), configure a true 301:
             
             Netlify (_redirects file):
               / /WebSite/ 301
             
             Apache (.htaccess):
               Redirect 301 / /WebSite/
             
             Nginx:
               rewrite ^/$ /WebSite/ permanent;
        ======================================== -->
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Redirecting to PanKUN Portfolio...</title>
        <meta
            name="description"
            content="PanKUNのポートフォリオサイトへリダイレクトします。"
        />
        
        <!-- Canonical URL pointing to main site -->
        <link
            rel="canonical"
            href="https://breadmotion.github.io/WebSite/"
        />
        
        <!-- Meta refresh redirect (0 seconds delay) -->
        <meta
            http-equiv="refresh"
            content="0; url=/WebSite/"
        />

        <!-- ========================================
             アイコン
        ======================================== -->
        <link
            rel="icon"
            type="image/x-icon"
            href="favicon.ico"
        />
        <link
            rel="icon"
            type="image/png"
            href="./WebSite/assets/img/favicon-32.png"
            sizes="32x32"
        />
        <link
            rel="icon"
            type="image/png"
            href="./WebSite/assets/img/favicon-192.png"
            sizes="192x192"
        />

        <!-- ========================================
             スタイル
        ======================================== -->
        <style>
            body {
                font-family:
                    "Helvetica Neue", Arial,
                    "Hiragino Kaku Gothic ProN",
                    "Hiragino Sans", Meiryo, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
                color: #333;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
                max-width: 600px;
                width: 90%;
            }
            h1 {
                margin-bottom: 1rem;
                font-size: 1.5rem;
                color: #2c3e50;
            }
            p {
                margin-bottom: 1rem;
                line-height: 1.6;
            }
            a {
                color: #3498db;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>

        <!-- ========================================
             JavaScript redirect fallback
        ======================================== -->
        <script>
            window.location.replace('/WebSite/');
        </script>

        <!-- ========================================
             Google 検索登録
        ======================================== -->
        <meta
            name="google-site-verification"
            content="2us9bSy_ytt-3S-o8CVDVK8SPFWC9G3h39tzB-TKq7c"
        />
    </head>
    <body>
        <!-- ========================================
             Fallback content for non-JS clients
        ======================================== -->
        <noscript>
            <div class="container">
                <h1>リダイレクト中 / Redirecting...</h1>
                <p>
                    メインサイトへ移動しています。自動的にリダイレクトされない場合は、以下のリンクをクリックしてください。<br />
                    If you are not redirected automatically, please click the link below.
                </p>
                <p>
                    <a href="/WebSite/">PanKUN Portfolio へ移動 / Go to PanKUN Portfolio</a>
                </p>
            </div>
        </noscript>
    </body>
</html>
