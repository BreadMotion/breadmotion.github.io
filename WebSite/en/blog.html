  var s = document.createElement('script');
  s.src = 'https://platform.twitter.com/widgets.js';
  s.charset = 'utf-8';

function ensureTwttrLoad(container){
  function run(){
    try{
      if (window.twttr && window.twttr.widgets && typeof window.twttr.widgets.load === 'function') {
        window.twttr.widgets.load(container);
      }
    }catch(e){ console.error(e); }
  }
  if (window.twttr && window.twttr.ready) {
    window.twttr.ready(run);
  } else {
    var tries = 0; var id = setInterval(function(){
      if (window.twttr && window.twttr.widgets && typeof window.twttr.widgets.load === 'function') { run(); clearInterval(id); }
      else if(++tries>20) clearInterval(id);
    }, 200);
  }
}
window.addEventListener('load', function(){ ensureTwttrLoad(document.body); });
