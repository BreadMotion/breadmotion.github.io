[package]
name = "bg_wasm"
version = "0.1.0"
authors = ["PanKUN <pankun.dev@gmail.com>"]
edition = "2021"
description = "Background animation WebAssembly module for PanKUN website"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
# optional helper to get better panic messages in console when enabled from JS
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "WebGl2RenderingContext",
  "MouseEvent",
  "Performance",
  "RequestAnimationFrameCallback",
  "console"
] }

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[profile.release]
# optimize for small wasm binary; adjust as needed
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.wasm-pack]
# hint for wasm-pack usage; builds should target 'web'
target = "web"
