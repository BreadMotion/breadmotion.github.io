    <body data-page="contact">
        <!-- Skip link for accessibility -->
        <a class="skip-link" href="#main">Skip to content</a>
        
        <!-- header は layout.js が自動挿入 -->
        <div class="page-shell">
            <main id="main" class="main-container">
                <section
                    class="page-header reveal-on-scroll"
                >
                    <h1>Contact</h1>
                    <p>
                        お仕事のご相談やご連絡は、以下のフォームからお願いします。
                    </p>
                    <p class="text-muted">
                        ※直接メールをお送りいただく場合は
                        <a
                            href="mailto:pankun.eng@gmail.com"
                            class="link-text"
                            >pankun.eng@gmail.com</a
                        >
                        までお願いします。
                    </p>
                </section>

                <section class="section reveal-on-scroll">
                    <div class="section-header">
                        <h2>お問い合わせフォーム</h2>
                    </div>

                    <form
                        id="contactForm"
                        class="contact-form"
                        novalidate
                    >
                        <div class="form-field">
                            <label
                                for="name"
                                class="form-label"
                            >
                                お名前
                                <span class="badge-required"
                                    >必須</span
                                >
                            </label>
                            <input
                                type="text"
                                id="name"
                                name="name"
                                class="input"
                                placeholder="山田 太郎"
                                required
                                aria-required="true"
                            />
                        </div>

                        <div class="form-field">
                            <label
                                for="email"
                                class="form-label"
                            >
                                メールアドレス
                                <span class="badge-required"
                                    >必須</span
                                >
                            </label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="input"
                                placeholder="example@email.com"
                                required
                                aria-required="true"
                            />
                        </div>

                        <div class="form-field">
                            <label
                                for="phone"
                                class="form-label"
                            >
                                電話番号
                                <span class="badge-optional"
                                    >任意</span
                                >
                            </label>
                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                class="input"
                                placeholder="090-0000-0000"
                            />
                        </div>

                        <div class="form-field">
                            <label
                                for="message"
                                class="form-label"
                            >
                                内容
                                <span class="badge-required"
                                    >必須</span
                                >
                            </label>
                            <textarea
                                id="message"
                                name="message"
                                class="input input--textarea"
                                rows="8"
                                placeholder="お問い合わせ内容をご記入ください。"
                                required
                                aria-required="true"
                            ></textarea>
                        </div>

                        <div class="form-actions">
                            <button
                                type="submit"
                                class="btn btn-primary btn-submit"
                            >
                                <span class="btn-text"
                                    >送信する</span
                                >
                                <span
                                    class="btn-loading-icon"
                                ></span>
                            </button>
                        </div>

                        <div
                            id="contactResult"
                            class="contact-result"
                            aria-live="polite"
                        ></div>
                    </form>
                </section>
            </main>
        </div>

        <!-- 共通JS -->
        <script src="assets/js/layout.js" defer></script>
